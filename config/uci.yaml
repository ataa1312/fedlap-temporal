# Federated ROLAND config for custom-uci. Partial: only keys that differ from
# configs/config.py defaults (overlaid on them at load time). Hyperparameters
# are provisional until Phase 5 aligns them to the centralized uci_table3_*.
seed: 1234
device: auto

dataset:
  name: custom-uci
  directed: false
  snapshot_freq: W
  split: [0.8, 0.1, 0.1]
  edge_dim: 1
  edge_encoder: true

subgraph:
  num_subgraphs: 3
  partitioning: random

train:
  mode: live_update
  num_epochs: 100
  num_runs: 3
  internal_validation_tolerance: 5

model:
  type: recurrent_gnn
  loss_fun: bce_with_logits
  edge_decoding: concat
  data_type: f+s
  smodel_type: LanczosLaplace
  fmodel_type: GNN

gnn:
  layer_type: residual_edge_conv
  embed_update_method: gru
  dim_inner: 64
  layers_mp: 2
  act: prelu
  skip_connection: affine

optim:
  optimizer: adam
  base_lr: 0.01
  weight_decay: 0.0005
  scheduler: none

meta:
  is_meta: false

spectral:
  spectral_len: 300
  L_type: rw
  matrix: lap
  method: arnoldi
  update_mode: update
  use_procrustes: true

federated:
  aggregation: fedavg
  weighting: node_count

wandb:
  project: dynamic-fedlap
  mode: offline
