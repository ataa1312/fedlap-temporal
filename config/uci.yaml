# Federated ROLAND config for uci. Partial: only keys that differ from
# config/config.py defaults (overlaid on them at load time). Aligned to the
# centralized configs/uci_gru.yaml (Phase 5): 8 MP layers, pre/post-MP, cos
# scheduler, meta-learning.
seed: 1234
device: auto

dataset:
  name: uci
  snapshot_freq: W
  split: [0.8, 0.1, 0.1]
  edge_dim: 1
  edge_encoder: true

subgraph:
  num_subgraphs: 3
  partitioning: random

train:
  mode: live_update
  num_epochs: 100
  num_runs: 3
  internal_validation_tolerance: 5

model:
  type: recurrent_gnn
  loss_fun: bce_with_logits
  edge_decoding: concat
  data_type: f+s
  smodel_type: LanczosLaplace
  fmodel_type: GNN
  iterations: 1          # FedAvg rounds per snapshot (C=1 faithful; raise for federated)
  local_epochs: 100      # inner ROLAND steps per round (a MAX; internal-validation early-stops)

gnn:
  layer_type: residual_edge_conv
  embed_update_method: gru
  dims_pre_mp: [64]
  dims: [64, 64, 64, 64, 64, 64, 64, 64]
  dims_post_mp: [128]
  act: prelu
  skip_connection: affine

optim:
  optimizer: adam
  base_lr: 0.01
  weight_decay: 0.0005
  scheduler: cos

meta:
  is_meta: true

spectral:
  spectral_len: 300
  L_type: rw
  matrix: lap
  method: arnoldi
  update_mode: update
  use_procrustes: true

federated:
  aggregation: fedavg
  weighting: node_count

wandb:
  project: dynamic-fedlap
  mode: offline
